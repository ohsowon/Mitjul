# 로컬 개발 프로필 - H2 인메모리 DB
spring:
  datasource:
    # MODE=PostgreSQL: 운영(PostgreSQL)과 SQL 방언 차이를 줄여 "로컬은 되는데 운영은 안 되는" 상황을 예방한다.
    url: jdbc:h2:mem:mitjul;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # 개발 중에는 엔티티 변경이 잦으므로 매번 스키마를 새로 만든다.
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    # 쿼리에 바인딩되는 파라미터 값까지 로그로 확인
    org.hibernate.orm.jdbc.bind: trace
