spring:
  application:
    name: mitjul

  profiles:
    default: dev

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:mitjul-local-dev-secret-key-please-change-in-production-0123456789}
  access-token-expire-ms: ${JWT_ACCESS_TOKEN_EXPIRE_MS:3600000}

storage:
  local:
    path: uploads