services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mitjul
      POSTGRES_USER: mitjul
      POSTGRES_PASSWORD: mitjul-local-pw
    ports:
      - "5432:5432"
    volumes:
      - mitjul-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitjul"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/mitjul
      DB_USERNAME: mitjul
      DB_PASSWORD: mitjul-local-pw
      JWT_SECRET: docker-compose-local-secret-key-please-change-0123456789
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy

volumes:
  mitjul-db-data: