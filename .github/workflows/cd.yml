name: CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build bootJar
        run: ./gradlew bootJar --no-daemon

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: build/libs/*.jar
          target: /home/ubuntu/mitjul-deploy

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cat > /home/ubuntu/mitjul-deploy/.env << 'EOF'
            ${{ secrets.ENV_FILE }}
            EOF

            docker rm -f mitjul-app || true

            docker run -d \
              --name mitjul-app \
              --env-file /home/ubuntu/mitjul-deploy/.env \
              -p 8080:8080 \
              -v /home/ubuntu/mitjul-deploy/build/libs/app.jar:/app/app.jar \
              eclipse-temurin:21-jre \
              java -jar /app/app.jar